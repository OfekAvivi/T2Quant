name: tests
on: [push, pull_request]
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install "transformers>=4.44,<4.50" datasets numpy matplotlib pytest
      - run: python -m pytest tests -q
